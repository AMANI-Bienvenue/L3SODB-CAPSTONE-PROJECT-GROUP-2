<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rich Motors - Luxury Cars</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <nav>
            <h1>Rich Motors</h1>

            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Cars</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-text">
            <h2>Discover Luxury & Performance</h2>
            <p>Premium vehicles for discerning drivers. Experience excellence on every road.</p>
            <button onclick="showMessage()">Explore Collection</button>
        </div>
    </section>

    <!-- Cars Section -->
    <section class="cars">

        <div class="car-card">
            <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70" alt="Car">
            <h3>BMW M4</h3>
            <p>$45,000</p>
            <button onclick="buyCar('BMW M4')">Buy Now</button>
        </div>

        <div class="car-card">
            <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7" alt="Car">
            <h3>Audi R8</h3>
            <p>$60,000</p>
            <button onclick="buyCar('Audi R8')">Buy Now</button>
        </div>

        <div class="car-card">
            <img src="https://images.unsplash.com/photo-1553440569-bcc63803a83d" alt="Car">
            <h3>Mercedes AMG</h3>
            <p>$70,000</p>
            <button onclick="buyCar('Mercedes AMG')">Buy Now</button>
        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 Rich Motors. All rights reserved. | Contact: info@richmotors.com</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
